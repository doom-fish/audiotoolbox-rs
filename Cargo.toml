[package]
name = "audiotoolbox"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/audiotoolbox-rs"
repository = "https://github.com/doom-fish/audiotoolbox-rs"
description = "Safe Rust bindings for Apple's AudioToolbox framework via a Swift bridge on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["audiotoolbox", "audio", "macos", "coreaudio", "apple"]
categories = ["multimedia::audio", "api-bindings", "os::macos-apis"]
rust-version = "1.82"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "COVERAGE.md",
    "LICENSE-*",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "audiotoolbox"
crate-type = ["lib"]

[features]
default = []
cargo-clippy = []
raw-ffi = []
async = []

[dependencies]
apple-cf = { path = "../apple-cf-rs", version = ">=0.11, <0.12", default-features = false }
libc = "0.2"
doom-fish-utils = { path = "../doom-fish-utils", version = ">=0.4.1, <0.5" }

[dev-dependencies]
# Cap the transitive bitflags pulled in via dev/transitive dependencies:
# bitflags 2.12.0 raises its MSRV / overflows macro recursion limits in some
# downstream crates, which breaks `--all-targets`/`--all-features` lint and
# test builds. This is a dev-only constraint and does not affect the published
# dependency set.
bitflags = ">=2.0, <2.12"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = "full"
strip = "none"
